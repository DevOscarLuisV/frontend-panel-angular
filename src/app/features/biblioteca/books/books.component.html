<div class="bg-white p-8 md:p-10 rounded-2xl shadow-lg border border-gray-100 mt-8 mx-4 md:mx-auto max-w-7xl min-h-[60vh] flex flex-col">

    <div class="mb-6 flex justify-between items-center">
        <h2 class="text-3xl font-serif font-bold text-[#4a2c2c] border-l-[5px] border-[#4070f4] pl-4">
            Inventario de Libros
        </h2>

        <input type="text" (input)="hacerFiltro($event)" 
            class="bg-white border border-gray-200 text-gray-700 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-72 p-3 outline-none shadow-sm"
            placeholder="Buscar por título o descripción...">
    </div>

    <div class=" flex-1 pb-16 relative">

      <!-- MAGIA AQUÍ: Quitamos el [lazy] y dejamos que PrimeNG haga el trabajo pesado -->
      <p-table #dt [value]="bookData" (onSort)="ordenarColumna($event)" [paginator]="true" [rows]="libroPorPagina" [tableStyle]="{ 'min-width': '50rem' }"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Mostrando {first} al {last} de {totalRecords} libros"
        paginatorTemplate="CurrentPageReport FirstPageLink PrevPageLink PageLinks NextPageLink LastPageLink RowsPerPageDropdown"
        [rowsPerPageOptions]="paginaCombo">

            <ng-template pTemplate="header">
                <tr class="border-b border-gray-200">
                    <th pSortableColumn="titulo" 
                        class="px-6 py-5 text-left text-sm font-medium uppercase tracking-wider transition-colors text-slate-600 ">
                        Título <p-sortIcon field="titulo"></p-sortIcon>
                    </th>
                    <th pSortableColumn="descripcion"
                        class="px-6 py-5 text-left text-sm font-medium uppercase tracking-wider transition-colors text-slate-600">
                        Descripción <p-sortIcon field="descripcion"></p-sortIcon>
                    </th>
                    <th pSortableColumn="autor.nombre"
                        class="px-6 py-5 text-left text-sm font-medium uppercase tracking-wider transition-colors text-slate-600">
                        Autor <p-sortIcon field="autor.nombre"></p-sortIcon>
                    </th>
                    <th pSortableColumn="precio"
                        class="px-6 py-5 text-left text-sm font-medium uppercase tracking-wider transition-colors text-slate-600">
                        Precio <p-sortIcon field="precio"></p-sortIcon>
                    </th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-book>
                <tr class="bg-slate-400 border-b border-gray-50 hover:bg-slate-50 transition-colors duration-200">

                    <td class="px-6 py-7 text-gray-700 font-medium text-lg">{{ book.titulo | titlecase }}</td>

                    <td class="px-6 py-7 text-gray-700 leading-relaxed max-w-md">{{ book.descripcion }}</td>

                    <td class="px-6 py-7 text-gray-500">
                        <span
                            class="bg-slate-50 text-gray-500 px-3 py-1.5 rounded-lg text-sm font-medium border border-gray-100 inline-flex items-center gap-2">
                            <i class="pi pi-user text-sm"></i> {{ book.autor?.nombre }} {{ book.autor?.apellido }}
                        </span>
                    </td>

                    <td class="px-6 py-7 text-[#5b7ce7] font-bold text-xl">
                        {{ book.precio | currency:'USD' }}
                    </td>
                </tr>
            </ng-template>

            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="4" class="bg-white p-16 text-center text-gray-400 font-medium">
                        <i class="pi pi-inbox text-5xl mb-4 text-gray-200 block"></i>
                        <span class="text-lg">No hay libros que coincidan con la búsqueda.</span>
                    </td>
                </tr>
            </ng-template>

        </p-table>

        <div class="card flex justify-end">

            <p-button (onClick)="showDialog()" label="+"
                styleClass="!bg-amber-400 hover:!bg-amber-500 !border-none transition-colors rounded-full w-12 h-12 flex items-center justify-center text-2xl text-white shadow-md hover:shadow-lg cursor-pointer">
            </p-button>

            <form #libroForm="ngForm" (ngSubmit)="guardarLibro(libroForm)">
                <p-dialog header="Agregar libro" [modal]="true" [(visible)]="visible" [style]="{ width: '40rem' }">

                    <span class="p-text-secondary block mb-8">Complete todos los campos para agregar un libro.</span>

                    <div class="flex flex-col gap-8 mb-6 mt-2">

                        <p-floatLabel class="w-full">
                            <input pInputText type="text" id="titulo" name="titulo" ngModel class="w-full" required />
                            <label for="titulo">Título</label>
                        </p-floatLabel>

                        <p-floatLabel class="w-full">
                            <input pInputText type="text" id="descripcion" name="descripcion" ngModel class="w-full"
                                required />
                            <label for="descripcion">Descripción</label>
                        </p-floatLabel>

                        <p-floatLabel class="w-full">
                            <p-select id="autor" name="autor" [options]="Autores"
                                ngModel optionLabel="nombre" class="w-full"
                                styleClass="w-full" [required]="true" appendTo="body" autocomplete="off">
                            </p-select>
                            <label for="descripcion">Seleccione un autor...</label>
                        </p-floatLabel>

                        <p-floatLabel class="w-full">
                            <input pInputText type="number" id="precio" name="precio" ngModel class="w-full" required />
                            <label for="precio">Precio</label>
                        </p-floatLabel>

                        <div class="w-full">
                            <label for="icondisplay" class="font-medium text-gray-700 block mb-2"> Fecha de Publicación
                            </label>

                            <p-datepicker id="icondisplay" name="fechaPublicacion" [(ngModel)]="fechaPublicacion"
                                iconDisplay="input" [showIcon]="true" dateFormat="dd/mm/yy" class="w-full"
                                styleClass="w-full" appendTo="body" [required]="true">
                            </p-datepicker>
                        </div>

                    </div>

                    <div class="flex justify-end gap-3 mt-8">
                        <p-button label="Cancelar" severity="secondary" (onClick)="visible = false"
                            type="button"></p-button>
                        <p-button label="Guardar" type="submit" [disabled]="libroForm.invalid"></p-button>
                    </div>

                </p-dialog>
            </form>
        </div>
    </div>
</div>
