<div
    class="bg-white p-8 md:p-10 rounded-2xl shadow-lg border border-gray-100 mt-8 mx-4 md:mx-auto max-w-7xl min-h-[60vh] flex flex-col">

    <div class="mb-6 flex justify-between items-center">
        <h2 class="text-3xl font-serif font-bold text-[#4a2c2c] border-l-[5px] border-[#4070f4] pl-4">
            Autores
        </h2>

        <input type="text" 
            class="bg-white border border-gray-200 text-gray-700 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-72 p-3 outline-none shadow-sm"
            placeholder="Buscar por título, autor...">
    </div>

    <div class=" flex-1 pb-16 relative">

        <p-table #dt [value]="autorData" [paginator]="true" [rows]="5" [tableStyle]="{ 'min-width': '50rem' }"
            [showCurrentPageReport]="true"
            currentPageReportTemplate="Mostrando {first} al {last} de {totalRecords} libros"
            paginatorTemplate="CurrentPageReport FirstPageLink PrevPageLink PageLinks NextPageLink LastPageLink RowsPerPageDropdown"
            [rowsPerPageOptions]="[5, 10, 20]">

            <ng-template pTemplate="header">
                <tr class="border-b border-gray-200">
                    <th pSortableColumn="nombre"
                        class="px-6 py-5 text-left text-sm font-medium uppercase tracking-wider transition-colors text-slate-600 ">
                        Nombre <p-sortIcon field="nombre"></p-sortIcon>
                    </th>
                    <th pSortableColumn="apellido"
                        class="px-6 py-5 text-left text-sm font-medium uppercase tracking-wider transition-colors text-slate-600">
                        Apellido <p-sortIcon field="Apellido"></p-sortIcon>
                    </th>
                    <th pSortableColumn="gradoAcademico"
                        class="px-6 py-5 text-left text-sm font-medium uppercase tracking-wider transition-colors text-slate-600">
                        Grado Academico <p-sortIcon field="GradoAcademico"></p-sortIcon>
                    </th>
                    
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-autor>
                <tr class="bg-slate-400 border-b border-gray-50 hover:bg-slate-50 transition-colors duration-200">

                    <td class="px-6 py-7 text-gray-700 font-medium text-lg">{{ autor.nombre }}</td>


                    <td class="px-6 py-7 text-gray-700 leading-relaxed max-w-md">{{ autor.apellido }}</td>

                    <td class="px-6 py-7 text-gray-500">
                        <span
                            class="bg-slate-50 text-gray-500 px-3 py-1.5 rounded-lg text-sm font-medium border border-gray-100 inline-flex items-center gap-2">
                            <i class="pi pi-user text-sm"></i> {{ autor.gradoAcademico }}
                        </span>
                    </td>

                </tr>
            </ng-template>

            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="4" class="bg-white p-16 text-center text-gray-400 font-medium">
                        <i class="pi pi-inbox text-5xl mb-4 text-gray-200 block"></i>
                        <span class="text-lg">No hay libros que coincidan con la búsqueda.</span>
                    </td>
                </tr>
            </ng-template>

        </p-table>

    </div>
</div>
