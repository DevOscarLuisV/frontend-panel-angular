<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-x-8 gap-y-4 content-start p-6 bg-stone-100 ">

    <div class="relative w-60 h-80 rounded-r-lg shadow-2xl overflow-hidden cursor-pointer transform transition-transform hover:-translate-y-2 hover:rotate-1 group" 
         (click)="onCliked()"
         style="background: linear-gradient(to right, #2c1a1a 0%, #4a2c2c 100%);">
        
        <div class="absolute inset-0 opacity-20 bg-[url('https://www.transparenttextures.com/patterns/dark-leather.png')]"></div>

        <div class="absolute left-0 top-0 bottom-0 w-4 bg-[#1a0f0f] rounded-l-sm border-r border-yellow-900/30 shadow-inner flex flex-col justify-between py-4 z-10">
            <div class="w-2 h-0.5 bg-yellow-700/50 mx-auto"></div>
            <div class="w-2 h-0.5 bg-yellow-700/50 mx-auto"></div>
            <div class="w-2 h-0.5 bg-yellow-700/50 mx-auto"></div>
        </div>

        <div class="absolute inset-4 left-8 border-2 border-yellow-700/50 rounded-sm p-4 flex flex-col items-center justify-center text-center z-10">
            
            <div class="text-yellow-600/70 text-xs mb-2">❦</div>

            <h3 class="text-xl font-serif font-bold text-yellow-200 leading-tight mb-3 tracking-wide px-2">
                {{tituloLibro}}
            </h3>

            <div class="w-16 h-px bg-yellow-700/50 mb-4"></div>

            <div class="bg-red-950 border border-red-700 text-red-200 px-4 py-1 rounded-full shadow-lg transform group-hover:scale-110 transition-transform">
                <p class="text-xs font-sans uppercase font-bold tracking-widest">
                    En oferta
                </p>
            </div>

            <div class="text-yellow-600/70 text-xs mt-auto">❧</div>
        </div>

        <div class="absolute w-full h-full bg-gradient-to-br from-white/10 via-transparent to-black/20 z-0"></div>

    </div>
    
   
</div>
