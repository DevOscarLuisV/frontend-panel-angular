<nav class="bg-white shadow-md px-8 py-4 flex justify-between items-center border-b-2 border-[#4a2c2c] sticky top-0 z-50">
  
    <div class="flex items-center gap-4">
        <p-button icon="pi pi-bars"
            class="hover:bg-slate-400 p-1 rounded-sm transition-all" 
            (onClick)="sidebarService.isOpen.set(!sidebarService.isOpen())" 
            [rounded]="true" 
            [text]="true" 
            severity="secondary">
        </p-button>
        
        <h1 class="text-2xl font-serif font-bold text-[#4a2c2c] flex items-center gap-2 cursor-default">
            📚 Mi App Angular
        </h1>
    </div>

    <div class="hidden md:flex justify-around gap-8 text-lg font-medium">
        
        @if (estadoUsuario) {
            <a routerLink="/" 
               routerLinkActive="text-[#4070f4] border-b-2 border-[#4070f4]" 
               [routerLinkActiveOptions]="{exact: true}"
               class="text-gray-500 hover:text-[#4070f4] transition-all py-1">
                Inicio
            </a>
            
             <a routerLink="/login" 
             (click)="cerrarSesion()"
               routerLinkActive="text-[#4070f4] border-b-2 border-[#4070f4]"
               class="text-gray-500 hover:text-[#4070f4] transition-all py-1">
                Salir
            </a>
        }

        @if (!estadoUsuario) {
            <a routerLink="/registrar"
               routerLinkActive="text-[#4070f4] border-b-2 border-[#4070f4]"
               class="text-gray-500 hover:text-[#4070f4] transition-all py-1">
                Registrar
            </a>

            <a routerLink="/login" 
               routerLinkActive="text-[#4070f4] border-b-2 border-[#4070f4]"
               class="text-gray-500 hover:text-[#4070f4] transition-all py-1">
                Login
            </a>
        }
        
    </div>
</nav>
